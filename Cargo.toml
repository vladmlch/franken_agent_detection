[package]
name = "franken-agent-detection"
version = "0.3.11"
edition = "2024"
# `rust-version = "1.85"` is the MSRV for the default detection-only build
# (`default = []`). Enabling `connectors` uses Rust 1.88+ `let`-chains, and
# SQLite-backed connector features require the pinned `rust-toolchain.toml`.
rust-version = "1.85"
license = "MIT"
description = "Local coding-agent detection and read-only session-history connectors with a normalized conversation model"
repository = "https://github.com/Dicklesworthstone/franken_agent_detection"
documentation = "https://docs.rs/franken-agent-detection"
readme = "README.md"
keywords = ["agent", "detection", "filesystem", "codex", "claude"]
categories = ["development-tools", "command-line-utilities"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/fad_illustration.webp",
    "/src/**",
    "/fixtures/**",
    "/tests/fixtures/**",
]

[dependencies]
# --- Always-on (detection + connector shared) ---
serde = { version = "1", features = ["derive"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"

# --- Optional: connector infrastructure ---
anyhow = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
walkdir = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }
dotenvy = { version = "0.15", optional = true }
bloomfilter = { version = "3", optional = true }
once_cell = { version = "1", optional = true }
urlencoding = { version = "2", optional = true }

# --- Optional: ChatGPT encrypted conversations ---
aes-gcm = { version = "0.11", optional = true }
base64 = { version = "0.23", optional = true }
blake3 = { version = "1", optional = true }
url = { version = "2", optional = true }

# --- Optional: SQLite-backed session databases ---
# Bundled SQLite engine behind the synchronous facade in
# connectors/sqlite_sync.rs; that module owns the zero-mutation open
# policy for external app stores.
rusqlite = { version = "=0.40.2", features = ["bundled", "modern_sqlite"], optional = true }
# Temp-dir free-space probe for the F9 snapshot-copy budget (F18,
# src/connectors/sqlite_sync.rs): this crate forbids `unsafe`, so the
# statvfs call rides fs4's safe API. default-features = false — only the
# ungated `available_space` probe is used, not the file-lock traits.
fs4 = { version = "0.13", default-features = false, optional = true }
# OpenClaw 2.0 stores larger transcript events as a Zstandard frame in
# `transcript_events.event_zstd` (with `event_json` NULL); see the
# `openclaw-sqlite` feature. Kept on 0.13 to share cass's existing copy.
zstd = { version = "0.13", default-features = false, optional = true }

[features]
default = []
# Base connector support: shared deps for built-in non-SQLite connectors
connectors = [
    "dep:anyhow",
    "dep:serde_json",
    "dep:walkdir",
    "dep:tracing",
    "dep:dotenvy",
    "dep:bloomfilter",
    "dep:once_cell",
]
# ChatGPT: AES-256-GCM decryption for v2/v3 encrypted conversations
chatgpt = ["connectors", "dep:aes-gcm", "dep:base64"]
# Internal base for the SQLite-backed connectors: the bundled `rusqlite`
# engine plus the `fs4` free-space probe the F18 snapshot budget needs.
# Also usable alone to build and test the `sqlite_sync` facade.
_sqlite-sync = ["connectors", "dep:rusqlite", "dep:fs4"]
# Cursor: SQLite database access for state.vscdb
cursor = ["_sqlite-sync", "dep:urlencoding"]
# OpenCode: SQLite database access for v1.2+ opencode.db
opencode = ["_sqlite-sync", "dep:urlencoding"]
# Goose: SQLite database access for Goose sessions.db
goose = ["_sqlite-sync", "dep:urlencoding"]
# Hermes: SQLite database access for Hermes Agent state.db
hermes = ["_sqlite-sync", "dep:urlencoding"]
# Crush: SQLite database access for Charm's Crush agent
crush = ["_sqlite-sync"]
# Devin CLI: read-only access to the shared ~/.local/share/devin/cli/sessions.db
# (cass #449). Without it the devin connector is detection-only.
devin = ["_sqlite-sync", "dep:urlencoding"]
# Grok Bot desktop rolling replicas. Hosts must reconcile provider entry IDs
# across FIFO rewrites before opting into ingestion (separate from Grok CLI).
grok-bot = ["connectors"]
# One shared on-disk CLI lineage; Freebuff and Codebuff cannot be attributed
# separately from their identical Manicode store.
codebuff = ["connectors"]
# Shelley (boldsoftware/shelley): schema-aware read-only access to Shelley's
# one-database-many-conversations shelley.db (WAL mode; cass gh#415). Its
# schema declares an FTS5 messages index, which the bundled SQLite build
# provides.
shelley = ["_sqlite-sync", "dep:blake3", "dep:base64", "dep:url"]
# OpenClaw 2.0 (v2026.8.1+): per-agent SQLite transcript store at
# agents/<agent>/agent/openclaw-agent.sqlite (transcript_events rows). Legacy
# JSONL sessions need no SQLite and remain available with the base
# `connectors` feature.
openclaw-sqlite = ["_sqlite-sync", "dep:zstd"]
# Codex: read `rollout-*.jsonl.zst`, the form Codex's
# `local_thread_store_compression` feature gives a finished session. Without
# it those sessions are not discovered.
codex-zstd = ["connectors", "dep:zstd"]
# Copilot legacy generation: pre-March-2025 VS Code chat sessions stored in
# workspace/global `state.vscdb` (`ItemTable` key `interactive.sessions`).
# The newer flat-JSON and append-log `chatSessions` generations need no SQLite
# and are always available with the base `connectors` feature.
copilot-vscdb = ["_sqlite-sync"]
# pi_agent_rust SQLite sessions (`<timestamp>_<uuid>.sqlite`, the
# `session_store = "sqlite"` backend) for the pi-family connectors. JSONL
# sessions need no SQLite.
pi-sqlite = ["_sqlite-sync"]
# Pi's experimental durable harness (`@earendil-works/pi-durable`): read-only
# access to its WAL-mode session.sqlite stores. JSONL commit-log stores need no
# SQLite and are read with the base `connectors` feature (#28).
pi-durable = ["_sqlite-sync"]
# Qoder: read-only access to Electron main.sqlite native session titles
qoder-sqlite = ["_sqlite-sync"]
# All connectors enabled
all-connectors = [
    "connectors",
    "codex-zstd",
    "chatgpt",
    "codebuff",
    "cursor",
    "devin",
    "opencode",
    "goose",
    "grok-bot",
    "hermes",
    "crush",
    "shelley",
    "openclaw-sqlite",
    "copilot-vscdb",
    "pi-durable",
    "pi-sqlite",
    "qoder-sqlite",
]

[dev-dependencies]
tempfile = "3.27"
serial_test = "4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# clippy::assert_is_empty landed in pedantic on the floating nightly
# (2026-08 toolchain drift) and flags ~35 pre-existing test assertions of
# the form `assert!(x.is_empty())` across connectors. The lint offers no
# mechanical rewrite; keep the established assertion style until then.
assert_is_empty = "allow"
