[package]
name = "franken-agent-detection"
version = "0.3.11"
edition = "2024"
# `rust-version = "1.85"` is the MSRV for the default detection-only build
# (`default = []`). Enabling `connectors` uses Rust 1.88+ `let`-chains, and
# SQLite-backed connector features require the pinned `rust-toolchain.toml`.
rust-version = "1.85"
license = "MIT"
description = "Local coding-agent detection and read-only session-history connectors with a normalized conversation model"
repository = "https://github.com/Dicklesworthstone/franken_agent_detection"
documentation = "https://docs.rs/franken-agent-detection"
readme = "README.md"
keywords = ["agent", "detection", "filesystem", "codex", "claude"]
categories = ["development-tools", "command-line-utilities"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/fad_illustration.webp",
    "/src/**",
    "/fixtures/**",
    "/tests/fixtures/**",
]

[dependencies]
# --- Always-on (detection + connector shared) ---
serde = { version = "1", features = ["derive"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"

# --- Optional: connector infrastructure ---
anyhow = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
walkdir = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }
dotenvy = { version = "0.15", optional = true }
bloomfilter = { version = "3", optional = true }
once_cell = { version = "1", optional = true }
urlencoding = { version = "2", optional = true }

# --- Optional: ChatGPT encrypted conversations ---
aes-gcm = { version = "0.11", optional = true }
base64 = { version = "0.23", optional = true }

# --- Optional: SQLite-backed session databases ---
frankensqlite = { version = "0.4.1", package = "fsqlite", optional = true }
# Drives fsqlite's async (!Send) engine futures to completion behind the
# connectors' synchronous API surface (see connectors/sqlite_sync.rs).
# fsqlite 0.4 names asupersync 0.5.x types in its public API, so the two
# must move in lockstep to preserve the bridge's runtime type identity.
asupersync = { version = "0.5.0", default-features = false, optional = true }
# Temp-dir free-space probe for the F9 snapshot-copy budget (F18,
# src/connectors/sqlite_sync.rs): this crate forbids `unsafe`, so the
# statvfs call rides fs4's safe API. default-features = false — only the
# ungated `available_space` probe is used, not the file-lock traits.
fs4 = { version = "0.13", default-features = false, optional = true }
# Codex stores compressed rollouts as Zstandard frames (`rollout-*.jsonl.zst`);
# see the `codex-zstd` feature. Kept on 0.13 to share cass's existing copy.
zstd = { version = "0.13", default-features = false, optional = true }

[features]
default = []
# Base connector support: shared deps for built-in non-SQLite connectors
connectors = [
    "dep:anyhow",
    "dep:serde_json",
    "dep:walkdir",
    "dep:tracing",
    "dep:dotenvy",
    "dep:bloomfilter",
    "dep:once_cell",
]
# ChatGPT: AES-256-GCM decryption for v2/v3 encrypted conversations
chatgpt = ["connectors", "dep:aes-gcm", "dep:base64"]
# Cursor: SQLite database access for state.vscdb
cursor = ["connectors", "dep:frankensqlite", "dep:urlencoding", "dep:asupersync", "dep:fs4"]
# OpenCode: SQLite database access for v1.2+ opencode.db
opencode = ["connectors", "dep:frankensqlite", "dep:urlencoding", "dep:asupersync", "dep:fs4"]
# Devin CLI: read-only access to the shared ~/.local/share/devin/cli/sessions.db
# (cass #449). Without it the devin connector is detection-only.
devin = ["connectors", "dep:frankensqlite", "dep:urlencoding", "dep:asupersync", "dep:fs4"]
# Codex: read `rollout-*.jsonl.zst`, the form Codex's
# `local_thread_store_compression` feature gives a finished session. Without
# it those sessions are not discovered.
codex-zstd = ["connectors", "dep:zstd"]
# Qoder: read-only access to Electron main.sqlite native session titles
qoder-sqlite = ["connectors", "dep:frankensqlite", "dep:asupersync", "dep:fs4"]
# All connectors enabled
all-connectors = [
    "connectors",
    "codex-zstd",
    "chatgpt",
    "cursor",
    "devin",
    "opencode",
    "qoder-sqlite",
]

[dev-dependencies]
tempfile = "3.27"
serial_test = "4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# clippy::assert_is_empty landed in pedantic on the floating nightly
# (2026-08 toolchain drift) and flags ~35 pre-existing test assertions of
# the form `assert!(x.is_empty())` across connectors. The lint offers no
# mechanical rewrite; keep the established assertion style until then.
assert_is_empty = "allow"

# fsqlite's async engine builds enormous debug-mode futures; at opt-level 0
# a single statement poll can overflow a 2 MiB test-thread stack. Upstream
# frankensqlite itself develops at `[profile.dev] opt-level = 1` for the same
# reason. Applies to dependencies only, never this crate's own test code.
[profile.dev.package."*"]
opt-level = 1

# cass F17 (2026-11-09): redirect of the fsqlite family to the fork that
# adds the strict read-only open mode (SQLITE_OPEN_STRICT_READ_ONLY,
# `Connection::open_strict_read_only`, `compat::open_strict_read_only`), which
# never creates or modifies any sidecar of a store it opens. Registry fsqlite
# 0.4.13 rebuilds a never-initialized `-shm` in place on a plain read-only
# open (GH#528), which touches the user's files; the fork refuses those
# classes with the typed BusyRecovery instead, so the F9 snapshot fallback
# engages again and the originals stay byte- and mtime-identical.
#
# Every family member the lockfile can resolve is listed: the fork's crates
# depend on each other through the fork workspace, so patching only the
# facade would mix the fork facade with registry siblings and fail to build.
# This table affects only FAD's own standalone builds and tests; the cass
# monorepo root ignores a member crate's patch table and pins the family
# through its own committed [patch.crates-io] table at the same rev. The
# entries point at the fork's pushed git revision (branch
# cass-local-fixes-0413-ro) so a fresh clone resolves the same bytes.
[patch.crates-io]
fsqlite = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-ast = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-btree = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-core = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-error = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-ext-fts5 = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-ext-icu = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-ext-json = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-ext-misc = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-ext-rtree = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-func = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-mvcc = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-observability = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-pager = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-parser = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-planner = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-types = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-vdbe = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-vfs = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
fsqlite-wal = { git = "https://github.com/vladmlch/frankensqlite", rev = "898c43612b36301168b97644a89df2fb933ca457" }
